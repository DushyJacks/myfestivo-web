competitors:
  - id: "comp_icommunify"
    name: "iCommunify"
    website: "https://icommunify.com"
    category: "Campus Event Platform"
    pricing_model: "free"
    target_audience: "US college students and organizations"
    strengths: |
      - All-in-one campus platform with club discovery and event management
      - Free to use for students
      - One-click event creation (60 second setup)
      - Auto calendar sync for RSVP confirmations
      - Attendance tracking built-in
      - Inter-college collaboration features
    weaknesses: |
      - Primarily US-college focused (email sign-up required)
      - Still in active development (announcements marked "coming soon")
      - Limited feature set compared to enterprise platforms
      - No clear monetization for college organizers
    notes: "Direct competitor in US market. Well suited for informal club events."
    data_confidentness: "from_competitor_analysis"

  - id: "comp_doorlist"
    name: "DoorList"
    website: "https://doorlist.io"
    category: "Social Event App"
    pricing_model: "0% fees"
    target_audience: "College students organizing informal events and parties"
    strengths: |
      - Mobile-first design with no ticket fees (hosts keep 100% of sales)
      - Group invite distribution via iMessage, Snapchat, messaging apps
      - Fast check-in with dynamic QR codes
      - Real-time guest lists for dynamic events
      - Perfect for campus parties and casual mixers
      - Frictionless social sharing
    weaknesses: |
      - Not designed for formal, large-scale events
      - Web listing/discovery limited (social-first distribution)
      - Limited organizer features (no analytics, limited management tools)
      - Not suitable for institutional events or competitions
    notes: "Strong competitor for informal social events. Weak on formal event needs."
    data_confidentness: "from_competitor_analysis"

  - id: "comp_thecollegefever"
    name: "The CollegeFever"
    website: "https://thecollegefever.com"
    category: "College Fest Ticketing"
    pricing_model: "commission-based"
    target_audience: "Technical fests, cultural fests, hackathons in India (especially IITs, NITs)"
    strengths: |
      - Well-established in India with strong brand recognition
      - Full-featured organizer dashboard (event editing, ticket sales, analytics)
      - Integrated payment processing with weekly payouts
      - Mobile app for organizers and participants
      - Heavy promotion and discovery network
      - Focus on large "fest" events with strong audience reach
    weaknesses: |
      - Commission fees on ticket sales (undisclosed but likely 5-10%)
      - Primarily focused on large "fest" events, not casual club events
      - Less suitable for small group gatherings or free events
      - Regional focus (strongest in India)
    notes: "Strong competitor in India for large festivals. Higher fees limit adoption for small events."
    data_confidentness: "from_competitor_analysis"

  - id: "comp_unstop"
    name: "Unstop"
    website: "https://unstop.com"
    category: "Campus Competition Platform"
    pricing_model: "freemium"
    target_audience: "Engineering students, hackathon participants, job seekers"
    strengths: |
      - Massive student user base (tens of millions)
      - Primary focus on hackathons, competitions, and employer hiring
      - Comprehensive assessment and analytics tools for companies
      - Strong reach among technical campus communities
      - Event listing and registration for contests
    weaknesses: |
      - Core focus on competitions/hackathons, not general events
      - Limited general event management features
      - Not designed for hosting casual club events or cultural activities
      - Recruitment-focused rather than event-centric
      - Analytics and tools primarily for employers, not organizers
    notes: "Threat mainly in hackathon/competition space. Not a general event platform."
    data_confidentness: "from_competitor_analysis"

  - id: "comp_eventbrite"
    name: "Eventbrite"
    website: "https://eventbrite.com"
    category: "Global Event Ticketing"
    pricing_model: "commission-based"
    target_audience: "Large events, ticketed events worldwide"
    strengths: |
      - Global market leader in event ticketing
      - Polished, mature platform with extensive features
      - Strong marketing integrations and event discovery
      - Large user base and high adoption
      - Comprehensive organizer tools
      - Payment processing and payout management
    weaknesses: |
      - High fees (3.7% + $1.79 per ticket + 2.9% payment processing)
      - Not tailored to college events or student budgets
      - Overkill for small, informal events
      - Premium pricing model limits adoption for free college events
      - Not campus-specific, generic event platform
    notes: "Used by universities for large events. Expensive for student organizers."
    data_confidentness: "from_competitor_analysis"

  - id: "comp_meraevents"
    name: "MeraEvents"
    website: "https://meraevents.com"
    category: "Event Marketplace"
    pricing_model: "commission-based"
    target_audience: "Event organizers across India and globally"
    strengths: |
      - Free event listing (no setup costs)
      - Full event ticketing widget available
      - SMS and email reminder capabilities
      - Broad event marketplace appeal
      - Analytics and attendee management
      - Global reach with India focus
    weaknesses: |
      - Commission fees (~4.71% total: 2% service + 1.99% gateway)
      - Not college-specific or student-focused
      - Primarily for professional/corporate events
      - Less suitable for small, free college events
      - Limited organizer community features
    notes: "Indirect competitor. Generic marketplace, not student-focused."
    data_confidentness: "from_competitor_analysis"

