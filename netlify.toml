[build]
  command = "npm run build"
  publish = ".next"

# Next.js with Netlify configuration
[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# ─── Rate Limiting (Edge Function) ───────────────────────────────────────────
# Runs the rate-limiter edge function on every /api/* request.
# Limits per endpoint group are defined in netlify/edge-functions/rate-limiter.ts
[[edge_functions]]
  path = "/api/*"
  function = "rate-limiter"

# ─── Next.js Plugin ──────────────────────────────────────────────────────────
# Required for proper SSR, dynamic routes, and page reloads in Next.js apps.
# Without this, direct URL access / reloads on dynamic routes (e.g. /events/:id)
# will fail with "This page couldn't load" because Netlify would try to serve
# a non-existent /index.html instead of letting Next.js handle the request.
[[plugins]]
  package = "@netlify/plugin-nextjs"


# ─── Compression ─────────────────────────────────────────────────────────────
# Netlify automatically applies Brotli and GZIP compression to all text-based
# responses (HTML, CSS, JS, JSON, SVG, XML). No additional configuration is
# needed. next.config.ts also sets `compress: true` for the Node server layer.

# ─── Cache: Next.js immutable static assets ──────────────────────────────────
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Cache: Fonts ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Cache: Images ───────────────────────────────────────────────────────────
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# ─── Cache: Favicon & App Icons ──────────────────────────────────────────────
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ─── Cache: JS & CSS bundles (non-immutable public assets) ───────────────────
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Environment variables will be set via Netlify UI
# See: https://docs.netlify.com/configure-builds/environment-variables/
# Required:
#   GMAIL_EMAIL         = myfestivo@gmail.com
#   GMAIL_APP_PASSWORD  = <16-char Gmail App Password>
#   NEXT_PUBLIC_APP_URL = https://myfestivo.live
