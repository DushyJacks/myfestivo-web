[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = ".next"

# Next.js with Netlify configuration
[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# Redirect all requests to index for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Cache settings
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Environment variables will be set via Netlify UI
# See: https://docs.netlify.com/configure-builds/environment-variables/
